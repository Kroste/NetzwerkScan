name: CI

# Build + Tests bei jedem Push auf main und bei jedem PR. Macht die Test-Pflicht
# durchsetzbar: rote Tests blockieren den Merge, statt erst beim Release aufzufallen.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer braucht die volle Historie inklusive Tags

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
